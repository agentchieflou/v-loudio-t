name: windows

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every test in this repo uses assert(), so all builds are Debug -- a Release
# (NDEBUG) build would compile the checks out and pass vacuously.
#
# Hosted runners have no GPU: Windows' own opengl32.dll is the GDI 1.1
# software renderer (no FBOs), so the offscreen/GL tests run against Mesa's
# llvmpipe opengl32.dll dropped next to each GL-using exe (opengl32 isn't a
# KnownDLL, so the app directory wins).
env:
  MESA_VERSION: 24.2.7

jobs:
  framework:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Mesa (software OpenGL)
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
      - name: Configure
        run: cmake -S Framework -B build/framework
      - name: Build
        run: cmake --build build/framework --config Debug
      - name: Install Mesa next to GL tests
        shell: pwsh
        run: Copy-Item mesa/x64/*.dll build/framework/Debug/
      - name: cuif_tests
        working-directory: build/framework/Debug
        run: ./cuif_tests.exe
      - name: cuif_offscreen_harness
        working-directory: build/framework/Debug
        run: ./cuif_offscreen_harness.exe

  plugin-abi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure DSP library
        run: cmake -S DSP -B build/dsp
      - name: Build DSP tests
        run: cmake --build build/dsp --config Debug
      - name: loudio_dsp_tests
        working-directory: build/dsp/Debug
        run: ./loudio_dsp_tests.exe
      - name: Configure
        run: cmake -S PluginABI -B build/abi
      - name: Build
        run: cmake --build build/abi --config Debug
      - name: lpi_host_harness
        working-directory: build/abi/bin/Debug
        run: ./lpi_host_harness.exe
      - name: lpi_rt_safety_test
        working-directory: build/abi/bin/Debug
        run: ./lpi_rt_safety_test.exe
      - name: lpi_conformance (toy gain)
        working-directory: build/abi/bin/Debug
        run: ./lpi_conformance.exe lpi_toy_gain.dll

  # One entry per VSTs/<Plugin> (tools/list_plugins.py), so a scaffolded
  # plugin is tested from its first push and a deleted one vanishes from CI
  # with no workflow edit (P4, #130).
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(python3 tools/list_plugins.py)" >> "$GITHUB_OUTPUT"

  plugin:
    needs: plugins
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.plugins.outputs.list) }}
    name: plugin (${{ matrix.plugin.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Fetch Mesa (software OpenGL)
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
      - name: Configure
        run: cmake -S VSTs/${{ matrix.plugin.name }} -B build/plugin
      - name: Build tests + LPI plugin
        run: cmake --build build/plugin --config Debug --target dsp_tests lpi_${{ matrix.plugin.lower }} lpi_${{ matrix.plugin.lower }}_gui_harness lpi_conformance
      - name: dsp_tests
        working-directory: build/plugin/Debug
        run: ./dsp_tests.exe
      - name: Install Mesa next to LPI GUI harness
        shell: pwsh
        run: Copy-Item mesa/x64/*.dll build/plugin/bin/Debug/
      - name: LPI GUI harness
        working-directory: build/plugin/bin/Debug
        run: ./lpi_${{ matrix.plugin.lower }}_gui_harness.exe
      - name: lpi_conformance
        working-directory: build/plugin/bin/Debug
        run: ./lpi_conformance.exe lpi_${{ matrix.plugin.lower }}.dll
      - name: Upload LPI GUI frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lpi-${{ matrix.plugin.lower }}-frames
          path: build/plugin/bin/Debug/*.ppm
          if-no-files-found: ignore
      - name: Build VST3 + Standalone
        run: cmake --build build/plugin --config Debug --target Loudio${{ matrix.plugin.name }}_VST3 Loudio${{ matrix.plugin.name }}_Standalone

  # Fast, GPU-free, JUCE-free DSP feedback: the shared DSP component tests
  # and every plugin's DSP tests (which need neither Windows nor JUCE) in
  # well under a minute.
  dsp-linux:
    needs: plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure DSP library
        run: cmake -S DSP -B build/dsp -DCMAKE_BUILD_TYPE=Debug
      - name: Build DSP tests
        run: cmake --build build/dsp
      - name: loudio_dsp_tests
        run: ./build/dsp/loudio_dsp_tests
      - name: Plugin DSP tests (no JUCE)
        env:
          PLUGINS: ${{ needs.plugins.outputs.list }}
        run: |
          set -e
          for name in $(echo "$PLUGINS" | python3 -c 'import json,sys; print(" ".join(p["name"] for p in json.load(sys.stdin)))'); do
            echo "::group::$name"
            cmake -S "VSTs/$name" -B "build/$name-tests" -DCMAKE_BUILD_TYPE=Debug -DLOUDIO_PLUGIN_TESTS_ONLY=ON
            cmake --build "build/$name-tests" --target dsp_tests
            "./build/$name-tests/dsp_tests"
            echo "::endgroup::"
          done
